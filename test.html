<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RNLI Test Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f0f0f0;
        }
        .test-section {
            background: white;
            padding: 20px;
            margin: 10px 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .error { color: red; }
        .success { color: green; }
        canvas {
            border: 2px solid #333;
            display: block;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>RNLI Mission Chief - Debug Page</h1>

    <div class="test-section">
        <h2>Canvas Test</h2>
        <canvas id="test-canvas" width="400" height="400"></canvas>
        <div id="canvas-result"></div>
    </div>

    <div class="test-section">
        <h2>JavaScript Console Output</h2>
        <div id="console-output"></div>
        <p>Also check your browser's developer console (F12) for more details.</p>
    </div>

    <div class="test-section">
        <h2>Quick Links</h2>
        <p><a href="index.html">Main Menu</a> | <a href="game.html">Game Direct Link</a></p>
    </div>

    <script>
        // Capture console output
        const consoleOutput = document.getElementById('console-output');
        const originalLog = console.log;
        const originalError = console.error;

        console.log = function(...args) {
            consoleOutput.innerHTML += '<div>' + args.join(' ') + '</div>';
            originalLog.apply(console, args);
        };

        console.error = function(...args) {
            consoleOutput.innerHTML += '<div class="error">ERROR: ' + args.join(' ') + '</div>';
            originalError.apply(console, args);
        };

        // Test canvas
        console.log('Testing canvas...');
        const canvas = document.getElementById('test-canvas');
        const canvasResult = document.getElementById('canvas-result');

        if (canvas) {
            console.log('Canvas element found ✓');
            const ctx = canvas.getContext('2d');

            if (ctx) {
                console.log('2D context obtained ✓');

                // Draw test pattern
                ctx.fillStyle = '#87CEEB';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#4CAF50';
                ctx.beginPath();
                ctx.arc(200, 200, 50, 0, Math.PI * 2);
                ctx.fill();

                canvasResult.innerHTML = '<div class="success">Canvas is working correctly!</div>';
                console.log('Canvas drawing successful ✓');
            } else {
                canvasResult.innerHTML = '<div class="error">Failed to get 2D context</div>';
                console.error('Failed to get 2D context');
            }
        } else {
            canvasResult.innerHTML = '<div class="error">Canvas element not found</div>';
            console.error('Canvas element not found');
        }

        // Test game.js loading
        console.log('Loading game.js for testing...');

        setTimeout(() => {
            if (typeof Map !== 'undefined') {
                console.log('Map class loaded ✓');
            } else {
                console.error('Map class not found');
            }

            if (typeof Game !== 'undefined') {
                console.log('Game class loaded ✓');
            } else {
                console.error('Game class not found');
            }
        }, 500);
    </script>
    <script src="game.js"></script>
</body>
</html>
